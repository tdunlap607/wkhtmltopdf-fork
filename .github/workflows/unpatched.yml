name: Unpatched
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Qt 4.8 removed - no longer available on modern Ubuntu
  # Qt 4.8 reached end-of-life in 2015
  
  qt5:
    name: Qt 5.15 on Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install packages
        run: sudo apt-get update && sudo apt-get install -y libqt5webkit5-dev libqt5xmlpatterns5-dev libqt5svg5-dev qtbase5-dev
      - name: build
        run: qmake CONFIG+=silent && make
      - name: verify binaries
        run: |
          ls -lh bin/
          file bin/wkhtmltopdf || true
          file bin/wkhtmltoimage || true
