name: Unpatched
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  # Qt 4.8 removed - no longer available on modern Ubuntu
  # Qt 4.8 reached end-of-life in 2015
  
  qt5:
    name: Qt 5.15 on Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Qt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-qt5-${{ hashFiles('.github/workflows/unpatched.yml') }}
          restore-keys: |
            ${{ runner.os }}-qt5-
      
      - name: Install Qt5 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libqt5webkit5-dev \
            libqt5xmlpatterns5-dev \
            libqt5svg5-dev \
            qtbase5-dev
      
      - name: Configure build
        run: qmake CONFIG+=silent
      
      - name: Build
        run: make -j$(nproc)
      
      - name: Verify binaries
        run: |
          ls -lh bin/
          file bin/wkhtmltopdf
          file bin/wkhtmltoimage
          LD_LIBRARY_PATH=bin bin/wkhtmltopdf --version
          LD_LIBRARY_PATH=bin bin/wkhtmltoimage --version
